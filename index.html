<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Notes Unlimited</title>
    <link rel="icon" type="image/jpeg" href="favicon.jpg">
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --primary: #f59e0b;
            --accent: #0ea5e9;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --bmc-yellow: #FFDD00;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(15, 23, 42, 0.9);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            z-index: 10;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: 700;
            font-size: 1.5rem;
        }

        .logo-img {
            width: 45px;
            height: 45px;
            object-fit: contain;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 5px;
            will-change: transform; /* Optimization for pulse */
        }

        .brand-link {
            color: var(--text);
            text-decoration: none;
            transition: color 0.2s ease;
        }
        
        .brand-link:hover { color: var(--primary); }

        .controls { display: flex; gap: 15px; }

        select, button {
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid var(--surface-color);
            background: var(--surface-color);
            color: var(--text);
            cursor: pointer;
            font-size: 0.9rem;
        }
        
        button#startButton {
            background: var(--primary);
            color: #000;
            border: none;
            font-weight: 600;
        }

        .main-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .note-container {
            text-align: center;
            margin-bottom: 20px;
            z-index: 2;
        }

        #swara-display {
            font-size: 7rem;
            font-weight: 800;
            margin: 0;
            line-height: 1;
            text-shadow: 0 0 30px rgba(245, 158, 11, 0.2);
        }

        #hz-display {
            font-family: monospace;
            color: var(--text-muted);
            font-size: 1.2rem;
            margin-top: 10px;
            min-height: 1.5em;
        }

        .fine-tune-bar {
            width: 300px;
            height: 6px;
            background: var(--surface-color);
            border-radius: 3px;
            margin: 25px auto;
            position: relative;
            overflow: visible;
        }
        .fine-tune-indicator {
            width: 12px;
            height: 12px;
            background: var(--text);
            position: absolute;
            left: 50%;
            top: -3px;
            transform: translateX(-50%);
            border-radius: 50%;
            transition: left 0.1s linear; 
        }
        .center-marker {
            position: absolute;
            left: 50%;
            height: 100%;
            width: 2px;
            background: var(--primary);
            transform: translateX(-50%);
            z-index: 1;
        }

        .visualizer-container {
            width: 100%;
            height: 200px;
            position: relative;
            background: linear-gradient(to bottom, transparent, rgba(30, 41, 59, 0.4));
        }

        #ribbon-canvas { width: 100%; height: 200px; }

        .bmc-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: var(--bmc-yellow);
            color: #000000;
            padding: 10px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 100;
        }

        .visitor-counter {
            position: fixed;
            bottom: 15px;
            left: 20px;
            opacity: 0.4;
            z-index: 10;
        }
        .visitor-counter img {
            height: 16px;
            filter: grayscale(1) invert(1);
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="favicon.jpg" class="logo-img" id="logo" alt="Logo">
            <a href="https://www.youtube.com/@NeuralNotesUnlimited" target="_blank" class="brand-link">Neural Notes Unlimited</a>
        </div>
        <div class="controls">
            <select id="tonic-select">
                <option value="0">Sa = C</option>
                <option value="1">Sa = C#</option>
                <option value="2">Sa = D</option>
                <option value="3">Sa = D#</option>
                <option value="4">Sa = E</option>
                <option value="5">Sa = F</option>
                <option value="6">Sa = F#</option>
                <option value="7">Sa = G</option>
                <option value="8">Sa = G#</option>
                <option value="9">Sa = A</option>
                <option value="10">Sa = A#</option>
                <option value="11">Sa = B</option>
            </select>
            <button id="startButton">Start Microphone</button>
        </div>
    </header>

    <div class="main-stage">
        <div class="note-container">
            <div id="swara-display">--</div>
            <div class="fine-tune-bar">
                <div class="center-marker"></div>
                <div class="fine-tune-indicator" id="cents-indicator"></div>
            </div>
            <div id="hz-display">Ready to sing</div>
        </div>
        <div class="visualizer-container">
            <canvas id="ribbon-canvas"></canvas>
        </div>
    </div>

    <div class="visitor-counter">
        <img src="https://hits.seeyoufarm.com/api/count/incr/badge.svg?url=https%3A%2F%2Fajayprk.github.io%2Fhindustani-pitch-tuner&count_bg=%231E293B&title_bg=%230F172A&icon=&icon_color=%23E7E7E7&title=hits&edge_flat=true" alt="Counter"/>
    </div>

    <a href="https://buymeacoffee.com/ajayprkm" target="_blank" class="bmc-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;"><path d="M18 8h1a4 4 0 0 1 0 8h-1"></path><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path><line x1="6" y1="1" x2="6" y2="4"></line><line x1="10" y1="1" x2="10" y2="4"></line><line x1="14" y1="1" x2="14" y2="4"></line></svg>
        Buy me a coffee
    </a>

    <script>
        const SARGAM = ["Sa", "re", "Re", "ga", "Ga", "ma", "Ma", "Pa", "dha", "Dha", "ni", "Ni"];
        const PITCH_SMOOTHING = 0.12; 
        const VIEW_SMOOTHING = 0.04; 
        const MEDIAN_WINDOW = 9; 
        const UI_UPDATE_INTERVAL = 100;
        const JUMP_THRESHOLD = 5; // Semitones

        const ribbonCanvas = document.getElementById('ribbon-canvas');
        const ctxRibbon = ribbonCanvas.getContext('2d');
        const swaraDisplay = document.getElementById('swara-display');
        const hzDisplay = document.getElementById('hz-display');
        const centsIndicator = document.getElementById('cents-indicator');
        const startBtn = document.getElementById('startButton');
        const logo = document.getElementById('logo');
        const tonicSelect = document.getElementById('tonic-select');

        let audioContext, analyser, biquadFilter, dataArray;
        let isRunning = false;
        let smoothedPitchMidi = 60; 
        let viewCenterMidi = 60; 
        let medianBuffer = [];
        let lastUIUpdateTime = 0;
        let stabilityCounter = 0;

        function resize() {
            ribbonCanvas.width = ribbonCanvas.offsetWidth;
            ribbonCanvas.height = ribbonCanvas.offsetHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function lerp(start, end, t) { return start * (1 - t) + end * t; }
        function freqToMidi(f) { return 12 * Math.log2(f / 440) + 69; }

        function autoCorrelate(buf, sampleRate) {
            let size = buf.length;
            let rms = 0;
            for (let i = 0; i < size; i++) rms += buf[i] * buf[i];
            rms = Math.sqrt(rms / size);
            if (rms < 0.005) return -1;

            let r1 = 0, r2 = size - 1, thres = 0.2;
            for (let i = 0; i < size / 2; i++) if (Math.abs(buf[i]) < thres) { r1 = i; break; }
            for (let i = 1; i < size / 2; i++) if (Math.abs(buf[size - i]) < thres) { r2 = size - i; break; }
            let audioSlice = buf.slice(r1, r2);
            let nsize = audioSlice.length;
            if (nsize === 0) return -1;
            
            let c = new Array(nsize).fill(0);
            for (let i = 0; i < nsize; i++) {
                for (let j = 0; j < nsize - i; j++) c[i] = c[i] + audioSlice[j] * audioSlice[j + i];
            }
            let d = 0; while (c[d] > c[d + 1]) d++;
            let maxval = -1, maxpos = -1;
            for (let i = d; i < nsize; i++) {
                if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
            }
            return sampleRate / maxpos;
        }

        async function startAudio() {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                biquadFilter = audioContext.createBiquadFilter();
                biquadFilter.type = "lowpass";
                biquadFilter.frequency.value = 1100; 
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 2048; 
                const source = audioContext.createMediaStreamSource(stream);
                source.connect(biquadFilter);
                biquadFilter.connect(analyser);
                dataArray = new Float32Array(analyser.fftSize);
                startBtn.style.display = 'none';
                isRunning = true;
                update();
            } catch (e) { alert("Mic access denied."); }
        }

        function update(currentTime) {
            if (!isRunning) return;
            analyser.getFloatTimeDomainData(dataArray);
            
            // Pulse Logo with Volume
            let rms = 0;
            for(let i=0; i<dataArray.length; i++) rms += dataArray[i]*dataArray[i];
            rms = Math.sqrt(rms/dataArray.length);
            logo.style.transform = `scale(${1 + rms * 3})`;

            let rawFreq = autoCorrelate(dataArray, audioContext.sampleRate);

            if (rawFreq > 50 && rawFreq < 1200) {
                medianBuffer.push(rawFreq);
                if (medianBuffer.length > MEDIAN_WINDOW) medianBuffer.shift();
                let sorted = [...medianBuffer].sort((a, b) => a - b);
                let stableFreq = sorted[Math.floor(sorted.length / 2)];
                let targetMidi = freqToMidi(stableFreq);

                // JUMP GUARD: Prevent octave spinning
                const jumpDist = Math.abs(targetMidi - smoothedPitchMidi);
                if (jumpDist > JUMP_THRESHOLD && stabilityCounter < 10) {
                    stabilityCounter++; // Ignore the jump briefly
                } else {
                    stabilityCounter = 0;
                    if (jumpDist > 3) smoothedPitchMidi = targetMidi;
                    else smoothedPitchMidi = lerp(smoothedPitchMidi, targetMidi, PITCH_SMOOTHING);
                }
                
                viewCenterMidi = lerp(viewCenterMidi, smoothedPitchMidi, VIEW_SMOOTHING);

                if (currentTime - lastUIUpdateTime > UI_UPDATE_INTERVAL) {
                    updateDisplay(smoothedPitchMidi, true, stableFreq);
                    lastUIUpdateTime = currentTime;
                }
            } else {
                if (currentTime - lastUIUpdateTime > UI_UPDATE_INTERVAL) {
                    updateDisplay(smoothedPitchMidi, false, 0);
                    lastUIUpdateTime = currentTime;
                }
            }

            drawRibbon(smoothedPitchMidi, viewCenterMidi);
            requestAnimationFrame(update);
        }

        function updateDisplay(midi, hasSignal, freq) {
            if (!hasSignal) {
                swaraDisplay.style.color = "#334155";
                return;
            }
            const roundedMidi = Math.round(midi);
            const tonic = parseInt(tonicSelect.value);
            let interval = (roundedMidi - tonic) % 12;
            if (interval < 0) interval += 12;

            swaraDisplay.innerText = SARGAM[interval];
            swaraDisplay.style.color = "#f59e0b"; 
            hzDisplay.innerText = `${freq.toFixed(1)} Hz`;

            const deviation = (midi - roundedMidi) * 100;
            centsIndicator.style.left = `${Math.max(0, Math.min(100, 50 + deviation))}%`;
            centsIndicator.style.background = Math.abs(deviation) < 10 ? "#22c55e" : "#f43f5e";
        }

        function drawRibbon(midi, viewCenter) {
            const w = ribbonCanvas.width, h = ribbonCanvas.height, cx = w / 2, pxPerSemi = w / 5; 
            ctxRibbon.clearRect(0, 0, w, h);
            ctxRibbon.font = "bold 24px sans-serif";
            ctxRibbon.textAlign = "center";
            const tonic = parseInt(tonicSelect.value);
            
            for (let m = Math.floor(viewCenter - 6); m <= Math.ceil(viewCenter + 6); m++) {
                const diff = m - viewCenter, x = cx + (diff * pxPerSemi);
                const alpha = 1 - (Math.abs(diff) / 6);
                if (alpha < 0) continue;
                let interval = (m - tonic) % 12;
                if (interval < 0) interval += 12;
                
                ctxRibbon.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctxRibbon.fillText(SARGAM[interval], x, h / 2 + 10);
            }
            
            const needleX = cx + ((midi - viewCenter) * pxPerSemi);
            ctxRibbon.strokeStyle = "#f59e0b"; 
            ctxRibbon.lineWidth = 4;
            ctxRibbon.beginPath(); 
            ctxRibbon.moveTo(needleX, 0); 
            ctxRibbon.lineTo(needleX, h); 
            ctxRibbon.stroke();
        }

        startBtn.addEventListener('click', startAudio);
    </script>
</body>
</html>
