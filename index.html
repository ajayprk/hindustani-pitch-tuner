<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neural Notes Unlimited</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --primary: #f59e0b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --bmc-yellow: #FFDD00;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* --- MOBILE RESPONSIVE HEADER --- */
        header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            z-index: 10;
            gap: 10px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .logo-img {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            transition: transform 0.1s ease-out;
        }

        .controls { 
            display: flex; 
            gap: 8px; 
            flex-grow: 1;
            justify-content: flex-end;
        }

        select, button {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--surface-color);
            background: var(--surface-color);
            color: var(--text);
            font-size: 0.85rem;
            outline: none;
        }
        
        button#startButton {
            background: var(--primary);
            color: #000;
            border: none;
            font-weight: 600;
        }

        @media (max-width: 600px) {
            header { padding: 10px; justify-content: center; }
            .controls { justify-content: center; width: 100%; }
            #swara-display { font-size: 5rem ! stroke-width: 0; }
        }

        .main-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .note-container {
            text-align: center;
            margin-bottom: 20px;
            z-index: 2;
        }

        #swara-display {
            font-size: 7rem;
            font-weight: 800;
            margin: 0;
            line-height: 1;
            text-shadow: 0 0 30px rgba(245, 158, 11, 0.2);
        }

        #hz-display {
            font-family: monospace;
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-top: 10px;
            min-height: 1.5em;
        }

        .fine-tune-bar {
            width: 80%;
            max-width: 300px;
            height: 6px;
            background: var(--surface-color);
            border-radius: 3px;
            margin: 20px auto;
            position: relative;
        }

        .fine-tune-indicator {
            width: 12px;
            height: 12px;
            background: var(--text);
            position: absolute;
            left: 50%;
            top: -3px;
            transform: translateX(-50%);
            border-radius: 50%;
        }

        .center-marker {
            position: absolute;
            left: 50%;
            height: 100%;
            width: 2px;
            background: var(--primary);
            transform: translateX(-50%);
        }

        .visualizer-container {
            width: 100%;
            height: 180px;
            position: relative;
            background: linear-gradient(to bottom, transparent, rgba(30, 41, 59, 0.4));
        }

        #ribbon-canvas { width: 100%; height: 180px; }

        .bmc-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: var(--bmc-yellow);
            color: #000;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 100;
        }

        .visitor-counter {
            position: fixed;
            bottom: 20px;
            left: 20px;
            opacity: 0.5;
            z-index: 10;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="favicon.png" class="logo-img" id="logo" alt="Logo">
            <span>Neural Notes Unlimited</span>
        </div>
        <div class="controls">
            <select id="range-select">
                <option value="universal">Universal</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>
            <select id="tonic-select">
                <option value="0">Sa=C</option><option value="1">C#</option><option value="2">D</option>
                <option value="3">D#</option><option value="4">E</option><option value="5">F</option>
                <option value="6">F#</option><option value="7">G</option><option value="8">G#</option>
                <option value="9">A</option><option value="10">A#</option><option value="11">B</option>
            </select>
            <button id="startButton">Start</button>
        </div>
    </header>

    <div class="main-stage">
        <div class="note-container">
            <div id="swara-display">--</div>
            <div class="fine-tune-bar">
                <div class="center-marker"></div>
                <div class="fine-tune-indicator" id="cents-indicator"></div>
            </div>
            <div id="hz-display">Ready to sing</div>
        </div>
        <div class="visualizer-container">
            <canvas id="ribbon-canvas"></canvas>
        </div>
    </div>

    <div class="visitor-counter">
        <img src="https://hits.seeyoufarm.com/api/count/incr/badge.svg?url=https%3A%2F%2Fajayprk.github.io%2Fhindustani-pitch-tuner&count_bg=%231E293B&title_bg=%230F172A&icon=&icon_color=%23E7E7E7&title=Hits&edge_flat=true" alt="Hits">
    </div>

    <a href="https://buymeacoffee.com/ajayprkm" target="_blank" class="bmc-btn">
        ☕ Buy coffee
    </a>

    <script>
        const SARGAM = ["Sa", "re", "Re", "ga", "Ga", "ma", "Ma", "Pa", "dha", "Dha", "ni", "Ni"];
        const PITCH_SMOOTHING = 0.12; 
        const VIEW_SMOOTHING = 0.05; 
        const MEDIAN_WINDOW = 9; 
        const SIGNAL_TIMEOUT = 1500; // Freeze ribbon for 1.5s after singing stops

        const ribbonCanvas = document.getElementById('ribbon-canvas');
        const ctxRibbon = ribbonCanvas.getContext('2d');
        const swaraDisplay = document.getElementById('swara-display');
        const hzDisplay = document.getElementById('hz-display');
        const centsIndicator = document.getElementById('cents-indicator');
        const startBtn = document.getElementById('startButton');
        const logo = document.getElementById('logo');
        const tonicSelect = document.getElementById('tonic-select');
        const rangeSelect = document.getElementById('range-select');

        let audioContext, analyser, biquadFilter, dataArray;
        let isRunning = false, lastSignalTime = 0;
        let smoothedPitchMidi = 60, viewCenterMidi = 60; 
        let medianBuffer = [], minFreq = 50, maxFreq = 1200;

        rangeSelect.addEventListener('change', () => {
            if(rangeSelect.value === 'male') { minFreq = 65; maxFreq = 500; }
            else if(rangeSelect.value === 'female') { minFreq = 160; maxFreq = 1100; }
            else { minFreq = 50; maxFreq = 1200; }
        });

        function resize() {
            ribbonCanvas.width = window.innerWidth;
            ribbonCanvas.height = 180;
        }
        window.addEventListener('resize', resize);
        resize();

        function lerp(a, b, t) { return a * (1 - t) + b * t; }
        function freqToMidi(f) { return 12 * Math.log2(f / 440) + 69; }

        function autoCorrelate(buf, sampleRate) {
            let rms = 0;
            for (let i = 0; i < buf.length; i++) rms += buf[i] * buf[i];
            if (Math.sqrt(rms / buf.length) < 0.008) return -1;

            let c = new Array(buf.length).fill(0);
            for (let i = 0; i < buf.length; i++) {
                for (let j = 0; j < buf.length - i; j++) c[i] += buf[j] * buf[j + i];
            }
            let d = 0; while (c[d] > c[d + 1]) d++;
            let maxval = -1, maxpos = -1;
            for (let i = d; i < buf.length; i++) {
                if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
            }
            return sampleRate / maxpos;
        }

        async function startAudio() {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 2048; 
            const source = audioContext.createMediaStreamSource(stream);
            source.connect(analyser);
            dataArray = new Float32Array(analyser.fftSize);
            startBtn.style.display = 'none';
            isRunning = true;
            loop();
        }

        function loop() {
            if (!isRunning) return;
            analyser.getFloatTimeDomainData(dataArray);
            
            let rms = 0;
            for(let i=0; i<dataArray.length; i++) rms += Math.abs(dataArray[i]);
            logo.style.transform = `scale(${1 + (rms/dataArray.length) * 5})`;

            let rawFreq = autoCorrelate(dataArray, audioContext.sampleRate);
            let now = Date.now();

            if (rawFreq > minFreq && rawFreq < maxFreq) {
                lastSignalTime = now;
                medianBuffer.push(rawFreq);
                if (medianBuffer.length > MEDIAN_WINDOW) medianBuffer.shift();
                let stableFreq = [...medianBuffer].sort((a,b)=>a-b)[Math.floor(medianBuffer.length/2)];
                let targetMidi = freqToMidi(stableFreq);

                smoothedPitchMidi = lerp(smoothedPitchMidi, targetMidi, PITCH_SMOOTHING);
                viewCenterMidi = lerp(viewCenterMidi, smoothedPitchMidi, VIEW_SMOOTHING);
                updateDisplay(smoothedPitchMidi, true, stableFreq);
            } else if (now - lastSignalTime > SIGNAL_TIMEOUT) {
                updateDisplay(smoothedPitchMidi, false, 0);
            }

            drawRibbon(smoothedPitchMidi, viewCenterMidi);
            requestAnimationFrame(loop);
        }

        function updateDisplay(midi, hasSignal, freq) {
            if (!hasSignal) { swaraDisplay.style.color = "#334155"; return; }
            const roundedMidi = Math.round(midi);
            let interval = (roundedMidi - parseInt(tonicSelect.value)) % 12;
            if (interval < 0) interval += 12;

            swaraDisplay.innerText = SARGAM[interval];
            swaraDisplay.style.color = "#f59e0b"; 
            hzDisplay.innerText = `${freq.toFixed(1)} Hz`;
            centsIndicator.style.left = `${50 + (midi - roundedMidi) * 100}%`;
        }

        function drawRibbon(midi, viewCenter) {
            const w = ribbonCanvas.width, h = ribbonCanvas.height, cx = w / 2, pxPerSemi = w / 5; 
            ctxRibbon.clearRect(0, 0, w, h);
            ctxRibbon.font = "bold 20px sans-serif";
            ctxRibbon.textAlign = "center";
            const tonic = parseInt(tonicSelect.value);
            
            for (let m = Math.floor(viewCenter - 5); m <= Math.ceil(viewCenter + 5); m++) {
                const x = cx + ((m - viewCenter) * pxPerSemi);
                let interval = (m - tonic) % 12;
                if (interval < 0) interval += 12;
                ctxRibbon.fillStyle = `rgba(255, 255, 255, ${1 - Math.abs(m-viewCenter)/5})`;
                ctxRibbon.fillText(SARGAM[interval], x, h / 2 + 10);
            }
            
            ctxRibbon.strokeStyle = "#f59e0b"; ctxRibbon.lineWidth = 4;
            ctxRibbon.beginPath(); ctxRibbon.moveTo(cx + (midi-viewCenter)*pxPerSemi, 0); 
            ctxRibbon.lineTo(cx + (midi-viewCenter)*pxPerSemi, h); ctxRibbon.stroke();
        }

        startBtn.addEventListener('click', startAudio);
    </script>
</body>
</html>
